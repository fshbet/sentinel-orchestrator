[build-system]
# >=83: PYSEC-2026-3447 is fixed there. Build-time only, but a compromised
# build backend is a compromised artifact.
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-orchestrator"
version = "0.1.0"
description = "Domain-agnostic, MCP-first AI orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# The core orchestration engine deliberately depends only on the standard
# library (ADR-011). Everything below is an opt-in integration.
dependencies = []

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
yaml = ["PyYAML>=6.0"]
http = ["httpx>=0.27"]
# Multi-instance state. asyncpg only; no ORM, in keeping with the
# core's standard-library-only rule for everything but optional extras.
postgres = ["asyncpg>=0.29"]

dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Pinned, not floating: the lint gate is only meaningful if it says the
# same thing locally and in CI, and a new rule release is a change to
# make deliberately rather than one that arrives with the next build.
lint = ["ruff==0.16.3", "mypy==2.4.0"]
all = [
  "typer>=0.12", "rich>=13.0",
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
  "PyYAML>=6.0", "httpx>=0.27",
    "asyncpg>=0.29",
]

[project.scripts]
orchestrator = "orchestrator.cli.main:main"

[project.entry-points."orchestrator.plugins"]
# Third-party plugins register here; none are required by the core.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.setuptools.package-data]
# The web console ships inside the package. Relying on a ui/ directory beside
# the source tree works in a checkout and silently produces an API with no
# console once installed.
orchestrator = ["ui/*.html"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Not `strict`. The codebase predates enforced annotations and turning
# everything on at once produces a wall nobody reads. The modules listed in
# `typed-modules.txt` are checked and gated in CI; the rest are reported so
# the debt stays visible.

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends()/Body() defaults are the documented idiom
    "S101",   # assert is how tests assert
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately contain credential-shaped fixtures and hardcoded
# addresses; that is what they are testing.
"tests/*" = ["S105", "S106", "S107", "S104", "S108", "S311", "S603"]
