<title>Orchestrator Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
/* ============================================================================
   Viyana UI/UX Foundations v3.1 — Violet Ember
   Light (Frost) is the default presentation; Dark (Obsidian) is a full
   alternative theme, not a separate identity.

   Font note: the spec asks for self-hosted Inter Variable. This build is a
   single portable file, so Inter and JetBrains Mono are loaded from Google
   Fonts with the specified fallback chain and font-display: swap.
   ========================================================================== */
:root {
  /* Primary ramp — Violet Ember */
  --color-primary-50:  #F5F3FF;
  --color-primary-100: #EDE9FE;
  --color-primary-200: #DDD6FE;
  --color-primary-300: #C4B5FD;
  --color-primary-400: #8B5CF6;   /* non-text only */
  --color-primary-500: #7C3AED;
  --color-primary-600: #6D28D9;
  --color-primary-700: #5B21B6;
  --color-primary-800: #4C1D95;
  --color-primary-900: #2E1065;

  /* Semantic */
  --color-success: #15803D;  --color-success-surface: #F0FDF4;
  --color-warning: #B45309;  --color-warning-surface: #FFFBEB;
  --color-error:   #C43D3D;  --color-error-surface:   #FEF2F2;
  --color-info:    #0F766E;  --color-info-surface:    #F0FDFA;
  --color-accent-coral:      #C2415D;
  --color-accent-coral-dark: #9F1239;
  --color-accent-coral-surface: #FFF1F3;

  /* Neutrals */
  --color-surface:          #FFFFFF;
  --color-surface-sunken:   #F5F7FA;
  --color-surface-disabled: #F3F4F6;
  --color-border-subtle:      #D8DEE8;
  --color-border-interactive: #828D9E;
  --color-text-primary:   #1F2937;
  --color-text-secondary: #5B6472;
  --color-text-disabled:  #9CA3AF;

  /* Glass & glow */
  --surface-glass: rgba(255, 255, 255, 0.72);
  --border-glass:  rgba(255, 255, 255, 0.40);
  --glow-primary:  0 0 18px rgba(124, 58, 237, 0.18);
  --glow-accent:   0 0 14px rgba(194, 65, 93, 0.18);

  /* Space — 4px base */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --space-12: 48px; --space-16: 64px;

  /* Radius */
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px;
  --radius-xl: 12px; --radius-2xl: 16px; --radius-full: 9999px;

  /* Elevation */
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-sm: 0 2px 6px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);

  /* Motion — spring-smooth, not snappy: this is a data-dense context */
  --ease-spring-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-fade: cubic-bezier(0.4, 0, 0.2, 1);
  --duration-instant: 75ms; --duration-fast: 150ms;
  --duration-normal: 250ms; --duration-slow: 400ms;

  /* Z-index */
  --z-sticky: 100; --z-popover: 1350; --z-toast: 1450;

  --font-ui:   "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-primary-50:  #1B1530;
    --color-primary-100: #251C3F;
    --color-primary-200: #35285A;
    --color-primary-300: #4C3A78;
    --color-primary-400: #7C5CE0;
    --color-primary-500: #A78BFA;
    --color-primary-600: #B794F6;
    --color-primary-700: #C4B5FD;
    --color-primary-800: #DDD6FE;
    --color-primary-900: #EDE9FE;

    --color-success: #34D399;  --color-success-surface: #062E1B;
    --color-warning: #FBBF24;  --color-warning-surface: #322006;
    --color-error:   #F87171;  --color-error-surface:   #361111;
    --color-info:    #5EEAD4;  --color-info-surface:    #082F2B;
    --color-accent-coral:      #FB7185;
    --color-accent-coral-dark: #FDA4AF;
    --color-accent-coral-surface: #3A1220;

    --color-surface:          #0F172A;
    --color-surface-sunken:   #080D1A;
    --color-surface-disabled: #1E293B;
    --color-border-subtle:      #1E293B;
    --color-border-interactive: #64748B;
    --color-text-primary:   #F8FAFC;
    --color-text-secondary: #94A3B8;
    --color-text-disabled:  #4B5563;

    --surface-glass: rgba(15, 23, 42, 0.78);
    --border-glass:  rgba(255, 255, 255, 0.12);
    --glow-primary:  0 0 22px rgba(167, 139, 250, 0.28);
    --glow-accent:   0 0 18px rgba(251, 113, 133, 0.28);

    --shadow-xs: 0 1px 2px rgba(0,0,0,0.12);
    --shadow-sm: 0 2px 6px rgba(0,0,0,0.14);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.16);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.18);
    --shadow-xl: 0 16px 48px rgba(0,0,0,0.22);
  }
}

:root[data-theme="dark"] {
  --color-primary-50:  #1B1530;
  --color-primary-100: #251C3F;
  --color-primary-200: #35285A;
  --color-primary-300: #4C3A78;
  --color-primary-400: #7C5CE0;
  --color-primary-500: #A78BFA;
  --color-primary-600: #B794F6;
  --color-primary-700: #C4B5FD;
  --color-primary-800: #DDD6FE;
  --color-primary-900: #EDE9FE;

  --color-success: #34D399;  --color-success-surface: #062E1B;
  --color-warning: #FBBF24;  --color-warning-surface: #322006;
  --color-error:   #F87171;  --color-error-surface:   #361111;
  --color-info:    #5EEAD4;  --color-info-surface:    #082F2B;
  --color-accent-coral:      #FB7185;
  --color-accent-coral-dark: #FDA4AF;
  --color-accent-coral-surface: #3A1220;

  --color-surface:          #0F172A;
  --color-surface-sunken:   #080D1A;
  --color-surface-disabled: #1E293B;
  --color-border-subtle:      #1E293B;
  --color-border-interactive: #64748B;
  --color-text-primary:   #F8FAFC;
  --color-text-secondary: #94A3B8;
  --color-text-disabled:  #4B5563;

  --surface-glass: rgba(15, 23, 42, 0.78);
  --border-glass:  rgba(255, 255, 255, 0.12);
  --glow-primary:  0 0 22px rgba(167, 139, 250, 0.28);
  --glow-accent:   0 0 18px rgba(251, 113, 133, 0.28);

  --shadow-xs: 0 1px 2px rgba(0,0,0,0.12);
  --shadow-sm: 0 2px 6px rgba(0,0,0,0.14);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.16);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.18);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.22);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--color-surface-sunken);
  color: var(--color-text-primary);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.5;
  font-variation-settings: 'opsz' 16;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
h1 { font-size: clamp(1.75rem, 1.25rem + 1.8vw, 2.5rem); line-height: 1.2; letter-spacing: -.02em; }
h2 { font-size: clamp(1.375rem, 1.1rem + 1.2vw, 2rem); line-height: 1.25; letter-spacing: -.015em; }
h3 { font-size: clamp(1.125rem, 1rem + .6vw, 1.5rem); line-height: 1.3; letter-spacing: -.01em; }
h4 { font-size: 1rem; line-height: 1.35; }
p  { margin: 0; }

.mono, code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.caption { font-size: .75rem; line-height: 1.4; letter-spacing: .01em; color: var(--color-text-secondary); }
.body-s  { font-size: .875rem; line-height: 1.45; }
.secondary { color: var(--color-text-secondary); }

:focus-visible {
  outline: 2px solid var(--color-primary-500);
  outline-offset: 3px;
  box-shadow: var(--glow-primary);
  border-radius: var(--radius-sm);
}

/* ---------- app shell ---------- */
.app {
  display: grid;
  grid-template-columns: 19rem minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head" "side main";
  height: 100vh;
  isolation: isolate;
}
@media (max-width: 768px) {
  .app { grid-template-columns: minmax(0,1fr); grid-template-areas: "head" "main"; height: auto; }
  .sidebar { display: none; }
}

/* ---------- header ---------- */
.topbar {
  grid-area: head;
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-6);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border-subtle);
  position: sticky; top: 0; z-index: var(--z-sticky);
}
.brand { display: flex; align-items: center; gap: var(--space-3); margin-right: auto; min-width: 0; }
.mark {
  width: 32px; height: 32px; border-radius: var(--radius-lg); flex: none;
  background: linear-gradient(145deg, var(--color-primary-500), var(--color-primary-700));
  display: grid; place-items: center; box-shadow: var(--glow-primary);
}
.mark svg { width: 18px; height: 18px; color: #fff; }
.brand-text { min-width: 0; }
.brand-text strong { display: block; font-size: .95rem; font-weight: 600; letter-spacing: -.01em; }
.brand-text span { display: block; font-size: .7rem; color: var(--color-text-secondary); letter-spacing: .04em; }

.status-chip {
  display: inline-flex; align-items: center; gap: var(--space-2);
  font-family: var(--font-mono); font-size: .7rem; font-weight: 500;
  padding: var(--space-1) var(--space-3); border-radius: var(--radius-full);
  border: 1px solid var(--color-border-subtle); background: var(--color-surface-sunken);
  color: var(--color-text-secondary); white-space: nowrap;
}
.status-chip .dot { width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-warning); flex: none; }
.status-chip.live { color: var(--color-success); border-color: var(--color-success); background: var(--color-success-surface); }
.status-chip.live .dot { background: var(--color-success); }

/* buttons */
.btn {
  font: inherit; font-size: .875rem; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 44px; padding: 0 var(--space-4);
  border-radius: var(--radius-md); border: 1px solid transparent;
  cursor: pointer; white-space: nowrap;
  transition: transform var(--duration-fast) var(--ease-spring-smooth),
              background var(--duration-fast) var(--ease-fade),
              border-color var(--duration-fast) var(--ease-fade);
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-primary { background: var(--color-primary-700); color: #fff; }
.btn-primary:hover { background: var(--color-primary-600); }
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary { color: #17102B; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn-primary { color: #fff; } }
.btn-outline {
  background: transparent; color: var(--color-text-primary);
  border-color: var(--color-border-interactive);
}
.btn-outline:hover { border-color: var(--color-primary-500); color: var(--color-primary-600); }
.btn-ghost { background: transparent; color: var(--color-text-secondary); padding: 0 var(--space-3); }
.btn-ghost:hover { background: var(--color-surface-sunken); color: var(--color-text-primary); }
.btn-danger { background: transparent; color: var(--color-error); border-color: var(--color-error); }
.btn-danger:hover { background: var(--color-error-surface); }
.btn-icon { min-width: 44px; padding: 0; }

/* ---------- sidebar ---------- */
.sidebar {
  grid-area: side;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border-subtle);
  display: flex; flex-direction: column; min-height: 0;
}
.sidebar > header {
  padding: var(--space-4) var(--space-5) var(--space-3);
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
}
.sidebar > header h2 {
  font-size: .7rem; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--color-text-secondary);
}
.run-list { overflow-y: auto; padding: 0 var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); }
.run-item {
  width: 100%; text-align: left; font: inherit; cursor: pointer;
  background: transparent; border: 1px solid transparent;
  border-left: 2px solid transparent;
  border-radius: var(--radius-md); padding: var(--space-3);
  display: flex; flex-direction: column; gap: var(--space-2);
  transition: background var(--duration-fast) var(--ease-fade);
}
.run-item:hover { background: var(--color-primary-50); }
.run-item[aria-current="true"] {
  background: var(--color-primary-100);
  border-left-color: var(--color-primary-500);
}
.run-item .obj {
  font-size: .875rem; line-height: 1.4; color: var(--color-text-primary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  line-clamp: 2; overflow: hidden;
}
.run-item[aria-current="true"] .obj { color: var(--color-primary-700); font-weight: 500; }
.run-item .meta { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

/* status + confidence pills — state encoded in form, not just colour */
.pill {
  display: inline-flex; align-items: center; gap: var(--space-1);
  font-family: var(--font-mono); font-size: .68rem; font-weight: 500;
  letter-spacing: .03em; padding: 2px var(--space-2);
  border-radius: var(--radius-sm); border: 1px solid;
  white-space: nowrap;
}
.pill::before { content: ""; width: 5px; height: 5px; border-radius: 1px; background: currentColor; flex: none; }
.pill.completed { color: var(--color-success); border-color: var(--color-success); background: var(--color-success-surface); }
.pill.running   { color: var(--color-info);    border-color: var(--color-info);    background: var(--color-info-surface); }
.pill.waiting   { color: var(--color-warning); border-color: var(--color-warning); background: var(--color-warning-surface); }
.pill.failed    { color: var(--color-error);   border-color: var(--color-error);   background: var(--color-error-surface); }
.pill.paused, .pill.cancelled { color: var(--color-text-secondary); border-color: var(--color-border-subtle); background: var(--color-surface-sunken); }
.pill.confirmed { color: var(--color-success); border-color: var(--color-success); background: var(--color-success-surface); }
.pill.likely    { color: var(--color-info);    border-color: var(--color-info);    background: var(--color-info-surface); }
.pill.uncertain { color: var(--color-warning); border-color: var(--color-warning); background: var(--color-warning-surface); }
.pill.blocked   { color: var(--color-text-secondary); border-color: var(--color-border-interactive); background: var(--color-surface-sunken); }
.pill.skipped   { color: var(--color-text-secondary); border-color: var(--color-border-subtle); background: var(--color-surface-sunken); }
.pill.lg { font-size: .78rem; padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); }

/* ---------- main ---------- */
.main { grid-area: main; overflow-y: auto; min-height: 0; }
.main-inner { max-width: 1000px; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-16); display: flex; flex-direction: column; gap: var(--space-6); }

/* prompt composer — an AI-native surface: distinct but calm */
.composer {
  background: var(--color-surface); border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-2xl); padding: var(--space-5);
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: var(--space-4);
}
.composer:focus-within { border-color: var(--color-primary-500); box-shadow: var(--glow-primary); }
.composer label { font-size: .875rem; font-weight: 500; }
.composer .hint { font-size: .8rem; color: var(--color-text-secondary); }
.composer textarea {
  font: inherit; font-size: 1rem; line-height: 1.5; resize: vertical;
  width: 100%; min-height: 84px; padding: var(--space-3);
  color: var(--color-text-primary); background: var(--color-surface);
  border: 1px solid var(--color-border-interactive); border-radius: var(--radius-md);
}
.composer textarea::placeholder { color: var(--color-text-disabled); }
.composer textarea:focus-visible { border-color: var(--color-primary-500); }
.composer-foot { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.context-pills { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-right: auto; }
.ctx-pill {
  font: inherit; font-size: .8rem; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: var(--space-2);
  min-height: 32px; padding: 0 var(--space-3); max-width: 180px;
  border-radius: var(--radius-full);
  background: var(--color-primary-100); color: var(--color-primary-700);
  border: 1px solid transparent;
}
.ctx-pill:hover { border-color: var(--color-primary-500); }
.ctx-pill .k { opacity: .7; font-size: .72rem; }

/* generic card */
.card {
  background: var(--color-surface); border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-xl); box-shadow: var(--shadow-xs); overflow: hidden;
}
.card > header {
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--color-border-subtle);
  display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
}
.card > header h3 { font-size: 1rem; margin-right: auto; }
.card > .body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }

/* ---------- verdict ---------- */
.verdict { display: flex; flex-direction: column; gap: var(--space-4); }
.verdict .headline { display: flex; align-items: flex-start; gap: var(--space-4); flex-wrap: wrap; }
.verdict .headline h2 { margin-right: auto; max-width: 60ch; }
.verdict-meta { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: var(--space-3); }
.stat {
  background: var(--color-surface-sunken); border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4);
}
.stat .v { font-size: 1.375rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; display: block; }
.stat .l { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 2px; display: block; }
.summary-text { font-size: 1rem; line-height: 1.55; max-width: 72ch; white-space: pre-wrap; }

/* ---------- devil's advocate ----------
   Coral is the brand's human-insight / editorial marker. The challenger is
   exactly that: a considered argument, not a system error. It must never be
   mistaken for a red failure state, so it never uses the error token. */
.advocate { border-color: var(--color-accent-coral); box-shadow: var(--glow-accent); }
.advocate > header {
  background: var(--color-accent-coral-surface);
  border-bottom-color: var(--color-accent-coral);
}
.advocate > header h3 { color: var(--color-accent-coral-dark); display: flex; align-items: center; gap: var(--space-2); }
.advocate > header svg { width: 18px; height: 18px; }
.advocate-strongest {
  font-size: 1rem; line-height: 1.55; max-width: 72ch;
  padding-left: var(--space-4); border-left: 2px solid var(--color-accent-coral);
}
.objections { display: flex; flex-direction: column; gap: var(--space-3); list-style: none; margin: 0; padding: 0; }
.objection {
  border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg);
  padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2);
  background: var(--color-surface);
}
.objection.critical    { border-left: 3px solid var(--color-error); }
.objection.substantive { border-left: 3px solid var(--color-warning); }
.objection.minor       { border-left: 3px solid var(--color-border-interactive); }
.objection .sev {
  font-family: var(--font-mono); font-size: .66rem; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
}
.objection.critical .sev    { color: var(--color-error); }
.objection.substantive .sev { color: var(--color-warning); }
.objection.minor .sev       { color: var(--color-text-secondary); }
.objection .claim { font-size: .8rem; color: var(--color-text-secondary); }
.objection .claim em { font-style: normal; color: var(--color-text-primary); }
.objection .text { font-size: .95rem; line-height: 1.5; }
.objection .resolve {
  font-size: .85rem; display: flex; gap: var(--space-2); align-items: flex-start;
  padding-top: var(--space-2); border-top: 1px dashed var(--color-border-subtle);
  color: var(--color-text-secondary);
}
.objection .resolve strong { color: var(--color-info); font-weight: 600; white-space: nowrap; }
.advocate-empty { display: flex; gap: var(--space-3); align-items: flex-start; font-size: .95rem; }
.advocate-empty svg { width: 20px; height: 20px; flex: none; margin-top: 2px; color: var(--color-success); }
.advocate-empty p { max-width: 72ch; }

/* ---------- plan ---------- */
.tasks { display: flex; flex-direction: column; gap: 0; }
.task {
  display: grid; grid-template-columns: auto minmax(0,1fr) auto;
  gap: var(--space-3); align-items: start;

// Served by the orchestrator itself: talk to it on the same origin, which
// keeps cookies and CORS out of it entirely. Opened as a file, fall back to

const API = location.protocol.startsWith("http")

try { TOKEN = sessionStorage.getItem("orchestrator-token") || ""; } catch {}

function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  return headers;
}

/* Every call to the orchestrator goes through here, so a 401 is handled in
   one place and no request can forget the token. */
async function api(path, options) {
  const opts = Object.assign({}, options || {});
  opts.headers = authHeaders(opts.headers);
  const res = await fetch(API + path, opts);
  if (res.status === 401) {
    needsToken = true;
    throw new Error("unauthorized");
  }
  if (!res.ok) throw new Error("http " + res.status);
  return res.json();
}

};

const ago = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};

/* ---------- connection ---------- */
async function probe() {
  const root = API.replace(/\/v1$/, "");
  try {
    // /live needs no credential by design, so it separates "nothing is
    // there" from "something is there and wants a token".
    const alive = await fetch(root + "/live", { signal: AbortSignal.timeout(2500) });
    if (!alive.ok) throw new Error("not alive");

    const probeRes = await fetch(API + "/executions?limit=1", {
      headers: authHeaders(), signal: AbortSignal.timeout(4000)
    });
    if (probeRes.status === 401) {
      LIVE = false;
      needsToken = true;
      $("#conn").classList.remove("live");
      $("#conn-text").textContent = "Sign in";
      return;
    }
    LIVE = probeRes.ok;
    needsToken = false;
    $("#conn").classList.toggle("live", LIVE);
    $("#conn-text").textContent = LIVE ? "Connected" : "Sample data";
  } catch {
    LIVE = false;
    $("#conn").classList.remove("live");
    $("#conn-text").textContent = "Sample data";
  }
}

/* Ask for the token, once, in the page rather than a browser dialog. */
function tokenPrompt() {
  const card = el("section", "card");
  const head = el("header");
  head.append(el("h3", null, "This orchestrator needs a token"));
  card.append(head);

    "It is running with authentication on. Paste an access token to continue — it is kept for this tab only and never written to disk."));

  const form = el("form");
  form.style.cssText = "display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center";

  const field = el("input");
  field.type = "password";
  field.name = "token";
  field.autocomplete = "current-password";
  field.placeholder = "Access token";
  field.setAttribute("aria-label", "Access token");
  field.style.cssText = "font:inherit;flex:1 1 18rem;min-height:44px;padding:0 var(--space-3);color:var(--color-text-primary);background:var(--color-surface);border:1px solid var(--color-border-interactive);border-radius:var(--radius-md)";

  const save = el("button", "btn btn-primary", "Connect");
  save.type = "submit";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    TOKEN = field.value.trim();
    if (!TOKEN) { field.focus(); return; }
    save.disabled = true; save.textContent = "Connecting…";
    try { sessionStorage.setItem("orchestrator-token", TOKEN); } catch {}
    await probe();
    if (LIVE) {
      await loadRuns(); renderRuns();
      if (runs.length) await select(runs[0].id); else renderDetail();
      toast("Connected.");
    } else {
      // Wrong token: clear it rather than leaving a bad credential to be
      // resent on every later call.
      TOKEN = "";
      try { sessionStorage.removeItem("orchestrator-token"); } catch {}
      needsToken = true;
      renderDetail();
      toast("That token was not accepted.");
    }
  });

  form.append(field, save);
  body.append(form);
  card.append(body);
  setTimeout(() => field.focus(), 0);
  return card;
}

async function loadRuns() {
  if (LIVE) {
    try {
      const data = await api("/executions?limit=25");
      runs = data.executions || [];
      return;
    } catch {
      LIVE = false;
      if (!needsToken) $("#conn-text").textContent = "Sample data";
    }
  }
  // A real orchestrator is there and wants a token. Showing worked examples
  // beside a sign-in prompt would read as though they were this instance's
  // runs, so show nothing until there is something true to show.
  runs = needsToken ? [] : DEMO.runs;
}

/* ---------- sidebar ---------- */
function renderRuns() {
  const list = $("#run-list");
  list.replaceChildren();
  if (!runs.length) {
    list.append(el("p", "caption", needsToken ? "Sign in to see runs." : "No runs yet."));
    return;
  }
  runs.forEach((r) => {
    const btn = el("button", "run-item");
    btn.type = "button";
    btn.setAttribute("role", "option");
    btn.setAttribute("aria-current", String(r.id === activeId));
    btn.setAttribute("aria-selected", String(r.id === activeId));

    btn.append(el("span", "obj", r.objective));
    const meta = el("div", "meta");
    meta.append(el("span", "pill " + r.status, r.status));
    if (r.confidence && r.status !== "waiting") meta.append(el("span", "pill " + r.confidence, r.confidence));
    meta.append(el("span", "caption", ago(r.updated_at)));
    btn.append(meta);

    btn.addEventListener("click", () => select(r.id));
    list.append(btn);
  });
}

/* ---------- detail ---------- */
/* The list endpoint returns a summary — id, objective, status, timestamps.
   Everything the detail view shows comes from the record and its audit trail,
   so selecting a run fetches both. */
async function select(id) {
  activeId = id;
  renderRuns();

  if (LIVE && !detailCache.has(id)) {
    renderDetail({ loading: true });
    try {
      const [record, audit] = await Promise.all([
        api(`/executions/${id}`),
        api(`/executions/${id}/audit?limit=200`)
      ]);
      detailCache.set(id, adapt(record, audit.events || []));
    } catch {
      detailCache.set(id, null);
      toast("Could not load that run.");
    }
  }
  renderDetail();
  $("#main").scrollTop = 0;
}

const detailCache = new Map();

/* Translate the API's record into what the view renders. Kept in one place so
   the shape the server speaks and the shape the page draws can move apart. */
function adapt(record, events) {
  const approval = (record.approvals || []).find((a) => a.status === "pending") || null;
  const usage = record.usage || {};
  return {
    id: record.id,
    objective: record.objective,
    status: record.status,
    confidence: record.confidence || "uncertain",
    updated_at: record.updated_at || new Date().toISOString(),
    summary: record.summary || "",
    usage: {
      model_calls: usage.model_calls || 0,
      tool_calls: usage.tool_calls || 0,
      input_tokens: usage.input_tokens || 0,
      output_tokens: usage.output_tokens || 0,
      cost: usage.cost || 0
    },
    tasks: (record.tasks || []).map((t) => ({
      id: t.id, name: t.name, status: t.status, agent: t.agent,
      model: t.model, depends_on: t.depends_on || [],
      detail: t.summary || "",
      attempts: t.attempts || 1
    })),
    validations: record.validations || [],
    advocate: record.advocate || { objections: [], strongest_case_against: "" },
    approval,
    audit: events.map((e) => ({
      seq: e.sequence,
      type: e.type,
      payload: summarisePayload(e.payload)
    }))
  };
}

/* Audit payloads are arbitrary objects. Render them as one readable line
   rather than raw JSON — the trail is meant to be scanned, not parsed. */
function summarisePayload(payload) {
  if (payload == null) return "";
  if (typeof payload !== "object") return String(payload);
  return Object.entries(payload)
    .filter(([, v]) => v !== null && v !== "" && !(Array.isArray(v) && !v.length))
    .slice(0, 4)
    .map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`)
    .join(", ")
    .slice(0, 240);
}

function icon(path, cls) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.75");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  if (cls) svg.setAttribute("class", cls);
  svg.setAttribute("aria-hidden", "true");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", path);
  svg.append(p);
  return svg;
}
const ICON_TICK = "M20 6 9 17l-5-5";
const ICON_CROSS = "M18 6 6 18M6 6l12 12";
const ICON_INFO = "M12 16v-4M12 8h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20";
const ICON_SCALE = "M12 3v18M5 7l-3 6h6zM19 7l-3 6h6zM7 7h10M5 21h14";

function renderDetail(state) {
  const host = $("#detail");
  host.replaceChildren();

  if (state && state.loading) {
    host.append(el("p", "caption", "Loading run…"));
    return;
  }

  if (needsToken && !LIVE) {
    host.append(tokenPrompt());
    return;
  }

  const run = LIVE
    ? detailCache.get(activeId)
    : runs.find((r) => r.id === activeId);

  if (!run) {
    const empty = el("div", "empty");
    empty.append(el("h3", null, "Nothing selected"));
    empty.append(el("p", null, "Pick a run from the left, or describe a new one above."));
    host.append(empty);
    return;
  }

  if (!LIVE) {
    const b = el("div", "banner");
    b.append(icon(ICON_INFO));
    const t = el("div");
    t.append(el("strong", null, "Sample data. "));
    t.append(document.createTextNode(
      "No orchestrator answered, so these are worked examples. Start one with "));
    t.append(el("code", "mono", "orchestrator serve"));
    t.append(document.createTextNode(" and reload to see your own runs."));
    b.append(t);
    host.append(b);
  }

  host.append(verdictCard(run));
  // When a decision is pending, the objections come first. They are the
  // argument the person is about to decide against, and reading them after
  // clicking Approve is reading them too late.
  if (run.approval) {
    host.append(advocateCard(run));
    host.append(approvalCard(run));
  } else {
    host.append(advocateCard(run));
  }
  host.append(planCard(run));
  host.append(checksCard(run));
  host.append(auditCard(run));
}

function verdictCard(run) {
  const card = el("section", "card");
  const body = el("div", "body verdict");

  const headline = el("div", "headline");
  headline.append(el("h2", null, run.objective));
  const meta = el("div", "verdict-meta");
  meta.append(el("span", "pill lg " + run.status, run.status));
  meta.append(el("span", "pill lg " + run.confidence, run.confidence));
  headline.append(meta);
  body.append(headline);

  if (run.confidence === "uncertain") {
    const b = el("div", "banner");
    b.append(icon(ICON_INFO));
    b.append(el("div", null,
      "Completed, but nothing could verify it. That is an honest result, not an error — give the success criteria a check that can actually run to reach “confirmed”."));
    body.append(b);
  }

  const done = run.tasks.filter((t) => t.status === "succeeded").length;
  const stats = el("div", "stat-row");
  const add = (v, l) => {
    const s = el("div", "stat");
    s.append(el("span", "v", v));
    s.append(el("span", "l", l));
    stats.append(s);
  };
  add(`${done}/${run.tasks.length}`, "tasks done");
  add(fmt(run.usage.model_calls), "model calls");
  add(fmt(run.usage.tool_calls), "tool calls");
  add(fmt(run.usage.input_tokens + run.usage.output_tokens), "tokens");
  add(run.usage.cost ? "$" + run.usage.cost.toFixed(2) : "free", "cost");
  body.append(stats);

  if (run.summary) body.append(el("p", "summary-text", run.summary));

  card.append(body);
  return card;
}

function approvalCard(run) {
  // Two different questions arrive on the same channel. "May I do this?"
  // takes a yes or no; "I need something from you" takes an answer. Showing
  // Approve/Reject for the second one asks the wrong question.
  const needsAnswer = run.approval.reason === "input";

  const card = el("section", "card approval");
  const head = el("header");
  head.append(el("h3", null, needsAnswer ? "It needs something from you" : "Your decision needed"));
  if (run.approval.risk && run.approval.risk !== "low") {
    head.append(el("span", "pill waiting", "risk: " + run.approval.risk));
  }
  card.append(head);

  const body = el("div", "body");
  body.append(el("p", "prompt", run.approval.prompt));

  const critical = ((run.advocate && run.advocate.objections) || [])
    .filter((o) => o.severity === "critical").length;
  if (critical) {
    const b = el("div", "banner");
    b.append(icon(ICON_INFO));
    b.append(el("div", null,
      `The devil's advocate raised ${critical} critical objection${critical > 1 ? "s" : ""} to the work leading up to this. Worth reading before you decide.`));
    body.append(b);
  }

  const actions = el("div", "actions");

  if (needsAnswer) {
    const field = el("textarea");
    field.id = "approval-answer";
    field.rows = 3;
    field.placeholder = "Type your answer…";
    field.setAttribute("aria-label", "Your answer");
    field.style.cssText = "font:inherit;width:100%;padding:var(--space-3);color:var(--color-text-primary);background:var(--color-surface);border:1px solid var(--color-border-interactive);border-radius:var(--radius-md);resize:vertical";
    body.append(field);

    const send = el("button", "btn btn-primary", "Send answer");
    send.addEventListener("click", () => respond(run, true, field.value.trim()));
    const stop = el("button", "btn btn-outline", "I can't answer — stop here");
    stop.addEventListener("click", () => respond(run, false));
    actions.append(send, stop);
  } else {
    const approve = el("button", "btn btn-primary", "Approve and continue");
    approve.addEventListener("click", () => respond(run, true));
    const reject = el("button", "btn btn-danger", "Reject — skip this task");
    reject.addEventListener("click", () => respond(run, false));
    actions.append(approve, reject);
  }

  if (run.approval.options && run.approval.options.length) {
    run.approval.options.forEach((opt) => {
      const b = el("button", "btn btn-outline", String(opt));
      b.addEventListener("click", () => respond(run, true, String(opt)));
      actions.append(b);
    });
  }

  body.append(actions);
  card.append(body);
  return card;
}

async function respond(run, approved, answer) {
  if (LIVE) {
    try {
      await api(`/executions/${run.id}/approvals/${run.approval.id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approved, response: answer || null, responder: "console" })
      });
      toast(approved ? "Sent. The run is continuing." : "Recorded. The run will stop or skip that step.");
      detailCache.delete(run.id);
      await loadRuns(); renderRuns(); await select(run.id);
      return;
    } catch { toast("Could not reach the orchestrator."); return; }
  }
  run.approval = null;
  run.status = approved ? "running" : "completed";
  run.confidence = approved ? "uncertain" : "uncertain";
  const t = run.tasks.find((x) => x.status === "waiting");
  if (t) t.status = approved ? "running" : "skipped";
  toast(approved ? "Approved. The run is continuing." : "Rejected. That task will be skipped.");
  renderRuns(); renderDetail();
}

/* The challenger. Coral, never red: this is a considered argument about the
   work, not a system failure, and the two must not look alike. */
function advocateCard(run) {
  const card = el("section", "card advocate");
  const head = el("header");
  const h = el("h3");
  h.append(icon(ICON_SCALE));
  h.append(document.createTextNode("Devil's advocate"));
  head.append(h);

  const objections = (run.advocate && run.advocate.objections) || [];
  const counts = objections.reduce((a, o) => ((a[o.severity] = (a[o.severity] || 0) + 1), a), {});
  if (objections.length) {
    if (counts.critical) head.append(el("span", "pill failed", counts.critical + " critical"));
    if (counts.substantive) head.append(el("span", "pill waiting", counts.substantive + " substantive"));
    if (counts.minor) head.append(el("span", "pill skipped", counts.minor + " minor"));
  }
  card.append(head);

  const body = el("div", "body");

  // Three states, and conflating the first two would be the exact error this
  // panel exists to catch: "nobody argued against it" is not "the argument
  // was made and failed".
  const ran = run.advocate ? run.advocate.ran !== false : false;

  if (!ran) {
    const e = el("div", "advocate-empty");
    e.append(icon(ICON_INFO));
    const t = el("div");
    t.append(el("p", null, "The devil's advocate did not run on this task, so nothing here has been argued against."));
    const how = el("p", "caption");
    how.style.marginTop = "var(--space-2)";
    how.append(document.createTextNode("To have it challenge a task, add "));
    how.append(el("code", "mono", '{"validator": "devils_advocate"}'));
    how.append(document.createTextNode(" to that task's validation list."));
    t.append(how);
    e.append(t);
    e.querySelector("svg").style.color = "var(--color-info)";
    body.append(e);
    card.append(body);
    return card;
  }

  if (!objections.length) {
    const e = el("div", "advocate-empty");
    e.append(icon(ICON_TICK));
    e.append(el("p", null,
      "It argued against this result and found nothing substantive. Worth remembering that silence from a challenger is one more opinion, not proof — it never raises confidence above “likely”."));
    body.append(e);
    card.append(body);
    return card;
  }

  body.append(el("p", "caption",
    "The case against this result. Every other check asks whether the work passed; this one asks what would make it wrong."));

  if (run.advocate.strongest_case_against) {
    body.append(el("p", "advocate-strongest", run.advocate.strongest_case_against));
  }

  const list = el("ul", "objections");
  objections.forEach((o) => {
    const li = el("li", "objection " + o.severity);
    li.append(el("span", "sev", o.severity));

    const claim = el("p", "claim");
    claim.append(document.createTextNode("Challenging: "));
    claim.append(el("em", null, "“" + o.claim + "”"));
    li.append(claim);

    li.append(el("p", "text", o.objection));

    const r = el("p", "resolve");
    r.append(el("strong", null, "Settled by"));
    r.append(document.createTextNode(o.resolves_it));
    li.append(r);

    list.append(li);
  });
  body.append(list);
  card.append(body);
  return card;
}

function planCard(run) {
  const card = el("section", "card");
  const head = el("header");
  head.append(el("h3", null, "Plan"));
  head.append(el("span", "caption", run.tasks.length + (run.tasks.length === 1 ? " task" : " tasks")));
  card.append(head);

  const body = el("div", "body");
  const list = el("div", "tasks");
  run.tasks.forEach((t) => {
    const row = el("div", "task");
    row.append(el("span", "task-marker " + t.status));

    const mid = el("div");
    mid.append(el("div", "name", t.name));
    if (t.detail) mid.append(el("div", "detail", t.detail));
    const dep = [];
    if (t.agent) dep.push(t.agent);
    if (t.model && t.model !== "—") dep.push(t.model);
    if (t.depends_on && t.depends_on.length) dep.push("after " + t.depends_on.join(", "));
    if (dep.length) mid.append(el("div", "dep", dep.join("  ·  ")));
    row.append(mid);

    row.append(el("span", "pill " + t.status, t.status));
    list.append(row);
  });
  body.append(list);
  card.append(body);
  return card;
}

function checksCard(run) {
  const card = el("section", "card");
  const head = el("header");
  head.append(el("h3", null, "Checks"));
  const failed = run.validations.filter((v) => !v.passed).length;
  head.append(el("span", "caption",
    failed ? `${failed} failed of ${run.validations.length}` : `all ${run.validations.length} passed`));
  card.append(head);

  const body = el("div", "body");
  const list = el("div", "checks");
  run.validations.forEach((v) => {
    const row = el("div", "check " + (v.passed ? "pass" : "fail"));
    row.append(icon(v.passed ? ICON_TICK : ICON_CROSS, "icon"));
    const mid = el("div");
    const name = el("div");
    name.append(el("span", "vname", v.validator));
    if (!v.mandatory) name.append(el("span", "caption", "  · advisory"));
    mid.append(name);
    mid.append(el("div", "msg", v.message));
    row.append(mid);
    row.append(el("span", "pill " + v.confidence, v.confidence));
    list.append(row);
  });
  body.append(list);
  card.append(body);
  return card;
}

function auditCard(run) {
  const card = el("details", "card audit");
  const summary = el("summary");
  summary.append(document.createTextNode("Decision trail"));
  summary.append(el("span", "caption", "  " + run.audit.length + " events"));
  card.append(summary);

  const list = el("div", "audit-list");
  run.audit.forEach((e) => {
    const row = el("div", "audit-row");
    row.append(el("span", "seq", String(e.seq)));
    row.append(el("span", "type", e.type));
    row.append(el("span", "payload", e.payload));
    list.append(row);
  });
  card.append(list);
  return card;
}

/* ---------- composer ---------- */
const PATTERNS = ["auto", "single_agent", "sequential", "parallel", "dynamic_dag", "evaluator_optimizer"];
const BUDGETS = ["20 model calls", "50 model calls", "150 model calls"];

function renderPills() {
  const host = $("#pills");
  host.replaceChildren();

  const mk = (key, label, value, cycle) => {
    const b = el("button", "ctx-pill");
    b.type = "button";
    b.append(el("span", "k", label));
    b.append(document.createTextNode(value));
    b.setAttribute("aria-label", `${label}: ${value}. Activate to change.`);
    b.addEventListener("click", cycle);
    host.append(b);
  };

  mk("pattern", "shape", options.pattern, () => {
    const i = PATTERNS.indexOf(options.pattern);
    options.pattern = PATTERNS[(i + 1) % PATTERNS.length];
    renderPills();
  });
  mk("budget", "budget", options.budget, () => {
    const i = BUDGETS.indexOf(options.budget);
    options.budget = BUDGETS[(i + 1) % BUDGETS.length];
    renderPills();
  });
}

async function startRun() {
  const objective = $("#objective").value.trim();
  if (!objective) { $("#objective").focus(); toast("Describe what you want done first."); return; }

  const btn = $("#run-btn");
  btn.disabled = true; btn.textContent = "Starting…";

  if (LIVE) {
    try {
      const body = { objective, run: true };
      if (options.pattern !== "auto") body.pattern = options.pattern;
      body.limits = { max_model_calls: parseInt(options.budget, 10) };
      const created = await api("/executions", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
      });
      detailCache.delete(created.id);
      await loadRuns(); renderRuns(); await select(created.id);
      toast("Run finished — check the confidence, not just the status.");
    } catch { toast("Could not reach the orchestrator."); }
  } else {
    toast("Sample mode: connect an orchestrator to start real runs.");
  }

  btn.disabled = false; btn.textContent = "Run";
  $("#objective").value = "";
}

/* ---------- command palette ---------- */
let paletteIndex = 0;
let paletteItems = [];

function openPalette() {
  $("#palette-backdrop").hidden = false;
  $("#palette-input").value = "";
  $("#palette-input").focus();
  fillPalette("");
}
function closePalette() {
  $("#palette-backdrop").hidden = true;
  $("#palette-open").focus();
}

function fillPalette(query) {
  const q = query.toLowerCase().trim();
  const commands = [
    { label: "New run", hint: "compose", act: () => { closePalette(); $("#objective").focus(); } },
    { label: "Switch theme", hint: "appearance", act: () => { closePalette(); toggleTheme(); } },
    { label: "Reload runs", hint: "data", act: async () => {
        closePalette(); detailCache.clear(); await probe(); await loadRuns(); renderRuns();
        if (activeId) await select(activeId); else renderDetail();
        toast("Reloaded."); } }
  ];
  const fromRuns = runs.map((r) => ({
    label: r.objective, hint: r.status, act: () => { closePalette(); select(r.id); }
  }));
  paletteItems = [...commands, ...fromRuns].filter((i) => !q || i.label.toLowerCase().includes(q)).slice(0, 8);
  paletteIndex = 0;
  drawPalette();
}

function drawPalette() {
  const host = $("#palette-results");
  host.replaceChildren();
  if (!paletteItems.length) {
    host.append(el("p", "caption", "Nothing matches."));
    return;
  }
  paletteItems.forEach((item, i) => {
    const b = el("button", "palette-item");
    b.type = "button";
    b.setAttribute("role", "option");
    b.setAttribute("aria-selected", String(i === paletteIndex));
    b.append(el("span", null, item.label));
    b.append(el("span", "k", item.hint));
    b.addEventListener("click", item.act);
    host.append(b);
  });
}

/* ---------- theme ---------- */
function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme");
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = current ? (current === "dark" ? "light" : "dark") : (systemDark ? "light" : "dark");
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("orchestrator-theme", next); } catch {}
}

/* ---------- wiring ---------- */
$("#run-btn").addEventListener("click", startRun);
$("#new-run").addEventListener("click", () => { activeId = null; renderRuns(); renderDetail(); $("#objective").focus(); });
$("#theme-toggle").addEventListener("click", toggleTheme);
$("#palette-open").addEventListener("click", openPalette);
$("#palette-input").addEventListener("input", (e) => fillPalette(e.target.value));

$("#objective").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); startRun(); }
});

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if ($("#palette-backdrop").hidden) return;
  if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); paletteIndex = Math.min(paletteIndex + 1, paletteItems.length - 1); drawPalette(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); paletteIndex = Math.max(paletteIndex - 1, 0); drawPalette(); }
  else if (e.key === "Enter" && paletteItems[paletteIndex]) { e.preventDefault(); paletteItems[paletteIndex].act(); }
});

$("#palette-backdrop").addEventListener("click", (e) => {
  if (e.target === $("#palette-backdrop")) closePalette();
});

(async function init() {
  try {
    const saved = localStorage.getItem("orchestrator-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch {}

  renderPills();
  await probe();
  await loadRuns();
  renderRuns();
  if (runs.length) await select(runs[0].id);
  else renderDetail();
})();
</script>
